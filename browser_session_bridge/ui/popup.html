<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>本地浏览器桥接</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --background: rgba(246, 246, 248, 0.92);
        --surface: rgba(255, 255, 255, 0.78);
        --surface-pressed: rgba(232, 232, 237, 0.92);
        --text: #1d1d1f;
        --muted: #6e6e73;
        --border: rgba(60, 60, 67, 0.22);
        --focus: #0071e3;
        --accent: #0071e3;
        --accent-pressed: #0058b0;
        --ready: #248a3d;
        --waiting: #a86400;
        --working: #0071e3;
        --error: #d70015;
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      html {
        background: transparent;
      }

      body {
        width: 336px;
        min-height: 250px;
        margin: 0;
        padding: 18px;
        overflow: hidden;
        color: var(--text);
        background: var(--background);
        backdrop-filter: blur(20px) saturate(160%);
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 16px;
        font-weight: 650;
        line-height: 1.25;
      }

      #build {
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
      }

      .connection {
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr);
        align-items: start;
        gap: 10px;
        min-height: 66px;
        padding: 13px 2px 12px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        margin-top: 5px;
        border-radius: 50%;
        background: var(--working);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--working) 14%, transparent);
      }

      .connection[data-tone="ready"] .status-dot {
        background: var(--ready);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ready) 14%, transparent);
      }

      .connection[data-tone="waiting"] .status-dot {
        background: var(--waiting);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--waiting) 14%, transparent);
      }

      .connection[data-tone="error"] .status-dot {
        background: var(--error);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--error) 14%, transparent);
      }

      #status {
        min-height: 19px;
        font-size: 14px;
        font-weight: 600;
      }

      #status-detail {
        min-height: 18px;
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(2, 42px);
        margin: 0;
        padding: 11px 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }

      .metric {
        min-width: 0;
        padding: 0 8px;
      }

      .metric:nth-child(3n + 1) {
        padding-left: 2px;
      }

      .metric:nth-child(3n) {
        padding-right: 2px;
      }

      .metric dt {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.25;
      }

      .metric dd {
        margin: 3px 0 0;
        overflow: hidden;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
        font-weight: 650;
        line-height: 1.3;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      button {
        min-height: 40px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font: inherit;
      }

      button {
        padding: 0 14px;
        color: var(--text);
        background: var(--surface);
        cursor: pointer;
        transition: transform 100ms ease-out, background-color 120ms ease-out, opacity 120ms ease-out;
      }

      button.primary {
        border-color: transparent;
        color: #fff;
        background: var(--accent);
        font-weight: 600;
      }

      button:active:not(:disabled) {
        transform: scale(0.97);
        background: var(--surface-pressed);
      }

      button.primary:active:not(:disabled) {
        background: var(--accent-pressed);
      }

      button:disabled {
        cursor: default;
        opacity: 0.46;
      }

      button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--focus) 34%, transparent);
        outline-offset: 2px;
      }

      #reconnect {
        display: grid;
        flex: 0 0 40px;
        width: 40px;
        min-height: 40px;
        padding: 0;
        place-items: center;
      }

      #reconnect svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: rgba(28, 28, 30, 0.94);
          --surface: rgba(58, 58, 60, 0.82);
          --surface-pressed: rgba(72, 72, 74, 0.94);
          --text: #f5f5f7;
          --muted: #aeaeb2;
          --border: rgba(235, 235, 245, 0.2);
          --focus: #64a8ff;
          --accent: #0a84ff;
          --accent-pressed: #0064c8;
          --ready: #30d158;
          --waiting: #ff9f0a;
          --working: #64a8ff;
          --error: #ff453a;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        :root {
          --background: #f6f6f8;
          --surface: #fff;
          --surface-pressed: #e8e8ed;
        }

        body {
          backdrop-filter: none;
        }
      }

      @media (prefers-reduced-transparency: reduce) and (prefers-color-scheme: dark) {
        :root {
          --background: #1c1c1e;
          --surface: #3a3a3c;
          --surface-pressed: #48484a;
        }
      }

      @media (prefers-contrast: more) {
        :root {
          --background: #fff;
          --surface: #fff;
          --text: #000;
          --muted: #3a3a3c;
          --border: #545458;
        }

        button {
          border-width: 2px;
        }
      }

      @media (prefers-contrast: more) and (prefers-color-scheme: dark) {
        :root {
          --background: #000;
          --surface: #1c1c1e;
          --text: #fff;
          --muted: #d1d1d6;
          --border: #aeaeb2;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>本地浏览器桥接</h1>
        <p id="build">正在读取扩展版本</p>
      </div>
      <button id="reconnect" type="button" aria-label="重新连接" title="重新连接">
        <svg data-lucide="refresh-cw" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 0 1-15.219 6.492L3 16"></path>
          <path d="M3 21v-5h5"></path>
          <path d="M3 12a9 9 0 0 1 15.219-6.492L21 8"></path>
          <path d="M21 3v5h-5"></path>
        </svg>
      </button>
    </header>

    <section id="connection" class="connection" data-tone="working" aria-live="polite" aria-atomic="true">
      <span class="status-dot" aria-hidden="true"></span>
      <div>
        <p id="status">正在读取本机状态</p>
        <p id="status-detail">本机 · 127.0.0.1:18765</p>
      </div>
    </section>

    <dl class="metrics" aria-label="通信指标">
      <div class="metric">
        <dt>往返延迟</dt>
        <dd id="metric-rtt">—</dd>
      </div>
      <div class="metric">
        <dt>在途</dt>
        <dd id="metric-in-flight">—</dd>
      </div>
      <div class="metric">
        <dt>排队</dt>
        <dd id="metric-queued">—</dd>
      </div>
      <div class="metric">
        <dt>成功</dt>
        <dd id="metric-succeeded">—</dd>
      </div>
      <div class="metric">
        <dt>失败</dt>
        <dd id="metric-failed">—</dd>
      </div>
      <div class="metric">
        <dt>最近响应</dt>
        <dd id="metric-last-response">—</dd>
      </div>
    </dl>

    <script type="module" src="popup_v2.js"></script>
  </body>
</html>
